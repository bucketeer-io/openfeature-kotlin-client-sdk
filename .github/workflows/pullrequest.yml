name: Pull Request

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed provider; the default "enhanced" one is proprietary
          cache-provider: basic

      - name: Ktlint
        run: ./gradlew lintKotlin --stacktrace

      - name: Check Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build all build types
        run: ./gradlew assemble --stacktrace

      - name: Run Bucketeer unit tests
        run: ./gradlew :openfeatureprovider:testDebugUnitTest --stacktrace

      - name: upload openfeatureprovider build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openfeatureprovider-build-reports
          path: openfeatureprovider/build/reports

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs="-XX:+HeapDumpOnOutOfMemoryError -XX:MetaspaceSize=1g"
